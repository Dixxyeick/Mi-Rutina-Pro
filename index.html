<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#1a0c02">

<link rel="manifest" href="./manifest.json">
<link rel="icon" type="image/png" href="./icono.png">

<style>
  body { 
    font-family: system-ui, -apple-system, sans-serif; 
    background-color: #0d0602;
    background-image: linear-gradient(rgba(10, 5, 1, 0.88), rgba(20, 10, 2, 0.94)), url('./icono.png');
    background-repeat: no-repeat;
    background-position: center center;
    background-size: cover;
    color: #f8fafc; 
    margin: 0; 
    padding: 8px; 
    padding-bottom: 40px; 
  }

  .btn-fullscreen { 
    position: fixed; 
    top: 8px; 
    left: 8px; 
    background: transparent; 
    color: rgba(255, 255, 255, 0.15); 
    border: none; 
    width: 40px; 
    height: 40px; 
    font-size: 20px; 
    cursor: pointer; 
    z-index: 99; 
  }

  .logo-container {
    width: 100%;
    aspect-ratio: 1 / 1.15;
    margin-top: 4px;
    margin-bottom: 8px;
    border-radius: 16px;
    border: 2px solid #fd5e09;
    box-shadow: 0 4px 20px rgba(253, 94, 9, 0.4);
    overflow: hidden;
    background-color: #050201;
    position: relative;
    box-sizing: border-box;
  }

  .logo-img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    object-position: center top;
    display: block;
  }

  .header-actions-left { position: absolute; bottom: 12px; left: 12px; z-index: 2; display: flex; gap: 6px; }
  .header-actions-right { position: absolute; bottom: 12px; right: 12px; z-index: 2; }

  .sticky-player {
    position: sticky;
    top: 4px;
    z-index: 90;
    box-shadow: 0 6px 20px rgba(0, 0, 0, 0.98);
    border: 2px solid #fd5e09 !important;
    border-radius: 14px;
    margin-top: 2px;
  }

  .marquee-container {
    width: 100%;
    overflow: hidden;
    white-space: nowrap;
    box-sizing: border-box;
  }

  .marquee-text {
    display: inline-block;
    padding-left: 100%;
    animation: marquee 14s linear infinite;
    font-size: 16px;
    font-weight: 900;
    color: #f59e0b;
    white-space: nowrap;
  }

  @keyframes marquee {
    0%   { transform: translate(0, 0); }
    100% { transform: translate(-100%, 0); }

  .player-btn-grid {
    display: flex;
    gap: 5px;
    width: 100%;
    margin-top: 6px;
    margin-bottom: 6px;
  }

  .player-btn-grid .btn-link {
    flex: 1;
    justify-content: center;
    text-align: center;
    padding: 8px 3px;
    font-size: 13.5px;
  }

  .card { 
    background: linear-gradient(145deg, rgba(31, 15, 4, 0.95), rgba(13, 6, 2, 0.95)); 
    padding: 10px 12px; 
    border-radius: 14px; 
    margin-bottom: 10px; 
    border: 1.5px solid #7c2d12; 
    box-shadow: inset 0 0 10px rgba(0,0,0,0.9), 0 4px 10px rgba(0,0,0,0.8);

  }

  .card-active {

    box-shadow: 0 0 15px rgba(34, 197, 94, 0.3);
  }
  
  label { font-size: 13px; color: #f97316; display: block; margin-bottom: 4px; font-weight: 800; text-transform: uppercase; letter-spacing: 0.5px; text-shadow: 1px 1px 2px #000; }
  select, input, textarea { background-color: #050201; color: #fff; border: 1.5px solid #7c2d12; padding: 8px 10px; border-radius: 9px; width: 100%; box-sizing: border-box; font-size: 15px; font-weight: 700; font-family: inherit; }
  select:focus, input:focus, textarea:focus { border-color: #fd5e09; outline: none; }
  
  textarea.auto-notes { 
    resize: none; 
    min-height: 38px; 
    height: 38px; 
    line-height: 1.35; 
    overflow: hidden; 
  }
  
  .series-table-header {
    display: grid;
    grid-template-columns: 36px 1.25fr 0.85fr 0.85fr;
    gap: 6px;
    margin-top: 8px;
    padding-bottom: 4px;
    border-bottom: 1px solid #7c2d12;
    font-size: 11.5px;
    font-weight: 800;
    color: #f59e0b;
    text-align: center;
    text-transform: uppercase;
  }

  .series-row {
    display: grid;

    gap: 6px;
    margin-top: 6px;
    align-items: center;
  }

    background: #1f0f04;
    border: 1px solid #fd5e09;
    color: #fd5e09;
    font-weight: 900;
    font-size: 13px;
    height: 38px;
    display: flex;
    align-items: center;
    justify-content: center;
    border-radius: 8px;
  }

  .series-num-warmup {
    background: rgba(56, 189, 248, 0.12);
    border: 1.5px solid #38bdf8;
    color: #38bdf8;
    font-weight: 900;
    font-size: 13px;
    height: 38px;
    display: flex;
    align-items: center;
    justify-content: center;

  }

  .series-row input.row-input { text-align: center; padding: 6px 4px; height: 38px; font-size: 14.5px; }

</style>

<body>

<script>
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('./sw.js?v=44').then(function(reg) {
    reg.update();
  }).catch(function(){});
}

// ==========================================
// 1. MANTENER PANTALLA ENCENDIDA (WAKE LOCK)
// ==========================================
var wakeLock = null;
async function requestWakeLock() {
  try {
    if ('wakeLock' in navigator) {
      wakeLock = await navigator.wakeLock.request('screen');
    }
  } catch (err) {}
}

document.addEventListener('visibilitychange', function() {
  if (wakeLock !== null && document.visibilityState === 'visible') {
    requestWakeLock();
  }
});

// ==========================================
// 2. INDEXEDDB AISLADA PARA VITALGYM
// ==========================================
var STORAGE_KEY = 'vitalgym_v44_pro_data';
var DB_NAME = 'VitalGym_V44_MediaDB';
var db;

function initDB(callback) {
  var request = indexedDB.open(DB_NAME, 1);
  request.onupgradeneeded = function(e) {
    var dbInstance = e.target.result;
    if (!dbInstance.objectStoreNames.contains('videos')) {
      dbInstance.createObjectStore('videos');
    }
    if (!dbInstance.objectStoreNames.contains('audio')) {
      dbInstance.createObjectStore('audio');
    }
  };
  request.onsuccess = function(e) {
    db = e.target.result;
    if (callback) callback();
  };
}

function saveVideoToDB(exId, blob) {
  if (!db) return;
  var tx = db.transaction('videos', 'readwrite');
  tx.objectStore('videos').put(blob, exId);
}

function loadAllVideosFromDB(callback) {
  if (!db) return;
  var tx = db.transaction('videos', 'readonly');
  var req = tx.objectStore('videos').openCursor();
  req.onsuccess = function(e) {
    var cursor = e.target.result;
    if (cursor) {
      localVideoFiles[cursor.key] = cursor.value;
      cursor.continue();
    } else {
      if (callback) callback();
    }
  };
}

function saveAudioToDB(files) {
  if (!db) return;
  var tx = db.transaction('audio', 'readwrite');
  var store = tx.objectStore('audio');
  store.clear();
  files.forEach(function(file, idx) {
    store.put(file, idx);
  });
}

function loadAllAudioFromDB(callback) {
  if (!db) return;
  var tx = db.transaction('audio', 'readonly');
  var store = tx.objectStore('audio');
  var req = store.openCursor();
  var loadedFiles = [];
  req.onsuccess = function(e) {
    var cursor = e.target.result;
    if (cursor) {
      loadedFiles.push(cursor.value);
      cursor.continue();
    } else {
      if (loadedFiles.length > 0) {
        playlist = loadedFiles;
        currentTrackIndex = 0;
        loadTrack(0, false);
      }
      if (callback) callback();
    }
  };
}

// ==========================================
// 3. NUEVA RUTINA ADAPTADA (SIN BICI, CON APROXIMACIONES Y COMPENSACIÓN)
// ==========================================
var baseRoutines = {
  "1": [

    { id: "d1_e3", name: "3. Remo máquina cerrado - Espalda", target: "4 series x 10 rep.", workSets: 4, defaultWeight: 30, defaultReps: "10", restShort: "(90-120s)", restSecs: 90 },
    { id: "d1_e4", name: "4. Press hombro palanca", target: "4 series x 10 rep.", workSets: 4, defaultWeight: 15, defaultReps: "10", restShort: "(90s)", restSecs: 90 },

    { id: "d1_e6", name: "6. Posteriores máquina - Hombro posterior", target: "4 series x 12 rep.", workSets: 4, defaultWeight: 20, defaultReps: "12", restShort: "(60-90s)", restSecs: 60 },
    { id: "d1_e7", name: "7. Abdominal inferior / Encogimientos", target: "3 series x 15 rep.", workSets: 3, defaultWeight: 0, defaultReps: "15", restShort: "(60s)", restSecs: 60 }
  ],
  "2": [
    { id: "d2_e1", name: "1. Press inclinado - Pecho", target: "Aprox: 2x30 | Efectivas: 4x10", warmupSets: 2, warmupReps: "30", warmupWeight: 15, workSets: 4, defaultWeight: 35, defaultReps: "10", restShort: "(60s aprox / 120s)", restSecs: 120 },

var playlist = [];
var currentTrackIndex = 0;
var isPlaying = false;

function playAlarmSound() {
  try {
    if (navigator.vibrate) navigator.vibrate([200, 100, 200, 100, 400]);
    var ctx = new (window.AudioContext || window.webkitAudioContext)();
    var osc = ctx.createOscillator();
    var gain = ctx.createGain();
    osc.type = 'sine';
    osc.frequency.setValueAtTime(880, ctx.currentTime);
    gain.gain.setValueAtTime(0.3, ctx.currentTime);
    osc.connect(gain);
    gain.connect(ctx.destination);
    osc.start();
    osc.stop(ctx.currentTime + 1.2);
  } catch(e){}
}

function loadAppData() {
  try {
    var saved = localStorage.getItem(STORAGE_KEY);
    if (saved) {
      var parsed = JSON.parse(saved);
      if (parsed && typeof parsed === 'object') appData = parsed;
    }
  } catch(e) {}
  if (!appData.history || !Array.isArray(appData.history)) appData.history = [];
  if (!appData.cloudMusicUrl) appData.cloudMusicUrl = "";
}

function setTodayDate() {
  var dateInput = document.getElementById('sessionDate');
  if (dateInput) {
    var today = new Date();
    var yyyy = today.getFullYear();
    var mm = String(today.getMonth() + 1);
    if (mm.length < 2) mm = '0' + mm;
    var dd = String(today.getDate());
    if (dd.length < 2) dd = '0' + dd;
    dateInput.value = yyyy + '-' + mm + '-' + dd;
  }
}

function getExerciseSetPlan(ex) {
  var wSets = ex.warmupSets || 0;
  var eSets = ex.workSets || 3;
  return {
    warmupSets: wSets,
    workSets: eSets,
    totalSets: wSets + eSets
  };
}

function getStepLabel(stepIndex, warmupSets) {
  if (stepIndex <= warmupSets) {
    return "Aprox " + stepIndex + "/" + warmupSets;
  }
  return "Serie " + (stepIndex - warmupSets);
}

function autoResizeNote(el) {
  if (!el) return;
  el.style.height = '38px';
  if (el.scrollHeight > 38) {
    el.style.height = el.scrollHeight + 'px';
  }
}

// ==========================================
// 4. ANCLAJE BAJO EL REPRODUCTOR Y RETORNO TRAS SCROLL
// ==========================================
function lockCardToTop(exId) {
  var card = document.getElementById('card_' + exId);
  var player = document.getElementById('mainPlayerCard');
  if (card && player) {
    var playerHeight = player.offsetHeight || 110;
    var cardTop = card.getBoundingClientRect().top + window.pageYOffset;
    window.scrollTo({
      top: cardTop - playerHeight - 10,
      behavior: 'smooth'
    });
  }
}

function handleUserScroll() {
  if (!activeTimerState || !activeTimerState.exId) return;
  
  if (scrollReturnTimeout) clearTimeout(scrollReturnTimeout);
  scrollReturnTimeout = setTimeout(function() {
    if (activeTimerState && activeTimerState.exId) {
      lockCardToTop(activeTimerState.exId);
    }
  }, 4000);
}

window.addEventListener('scroll', handleUserScroll, { passive: true });
window.addEventListener('touchmove', handleUserScroll, { passive: true });

// ==========================================
// 5. GESTIÓN DE VÍDEOS
// ==========================================
function handleVideoFolderUpload(e) {
  var files = Array.from(e.target.files).filter(function(f) {
    return f.type.startsWith('video/') || f.name.match(/\.(mp4|webm|mkv|mov|avi)$/i);
  });

  if (files.length === 0) {
    alert("No se encontraron vídeos en la carpeta seleccionada.");
    return;
  }

  var count = 0;
  var allEx = [];
  Object.keys(baseRoutines).forEach(function(day) {
    baseRoutines[day].forEach(function(ex) {
      allEx.push({ day: day, ex: ex });
    });
  });

  files.forEach(function(file) {
    var fname = file.name.toLowerCase();
    allEx.forEach(function(item) {
      var ex = item.ex;
      var exIdParts = ex.id.match(/^d(\d+)_e(\d+)$/);
      if (exIdParts) {
        var dayNum = String(parseInt(exIdParts[1], 10));
        var exNum = String(parseInt(exIdParts[2], 10));
        var padDay = dayNum.length < 2 ? '0' + dayNum : dayNum;
        var padEx = exNum.length < 2 ? '0' + exNum : exNum;

        var pattern1 = padDay + '.' + padEx;
        var pattern2 = dayNum + '.' + exNum;
        var pattern3 = padDay + '_' + padEx;

        if (fname.includes(pattern1) || fname.includes(pattern2) || fname.includes(pattern3) || fname.includes(ex.name.toLowerCase())) {
          localVideoFiles[ex.id] = file;
          saveVideoToDB(ex.id, file);
          count++;
        }
      }
    });
  });

  window.renderExercises();
  alert("¡Vídeos guardados permanentemente! Se asignaron " + count + " vídeos.");
}

function handleSingleVideoUpload(exId, e) {
  var file = e.target.files[0];
  if (file) {
    localVideoFiles[exId] = file;
    saveVideoToDB(exId, file);
    toggleInlineVideo(exId);
  }
}

function toggleInlineVideo(exId) {
  var wrapper = document.getElementById(exId + '_videoWrapper');
  var video = document.getElementById(exId + '_video');
  var btn = document.getElementById(exId + '_videoBtn');

  if (!wrapper || !video) return;

  if (wrapper.style.display === 'block') {
    wrapper.style.display = 'none';
    video.pause();
    video.src = '';
    if (btn) btn.textContent = '▶ Vídeo';
  } else {
    var file = localVideoFiles[exId];
    if (!file) {
      document.getElementById(exId + '_singleVideoInput').click();
      return;
    }
    video.src = URL.createObjectURL(file);
    wrapper.style.display = 'block';
    video.play().catch(function(){});
    if (btn) btn.textContent = '✕ Ocultar';
    setTimeout(function() { lockCardToTop(exId); }, 100);
  }
}

// ==========================================
// 6. RENDERIZADO DE EJERCICIOS CON APROXIMACIONES (A1, A2) Y EFECTIVAS (S1..S4)
// ==========================================
window.renderExercises = function() {
  var daySelect = document.getElementById('daySelect');
  if (!daySelect) return;
  var currentDay = daySelect.value;
  var container = document.getElementById('exercisesContainer');
  if (!container) return;
  
  container.innerHTML = '';
  
  if (!currentDay || !baseRoutines[currentDay]) {
    container.innerHTML = '<p style="text-align:center; color:#a1a1aa; padding: 24px; font-size: 15px;">👆 Selecciona un bloque en <strong>Bloque de Entreno</strong> para cargar los ejercicios.</p>';
    return;
  }
  
  var exercises = baseRoutines[currentDay];
  var lastSession = { data: {} };
  for (var i = appData.history.length - 1; i >= 0; i--) {
    if (String(appData.history[i].day) === String(currentDay)) {
      lastSession = appData.history[i];
      break;
    }
  }

  for (var j = 0; j < exercises.length; j++) {
    var ex = exercises[j];
    var exData = (lastSession.data && lastSession.data[ex.id]) ? lastSession.data[ex.id] : { weight: ex.defaultWeight, reps: ex.defaultReps, notes: '', sets: [] };
    var plan = getExerciseSetPlan(ex);
    var hasVideo = !!localVideoFiles[ex.id];

    var card = document.createElement('div');
    card.className = "card";
    card.id = 'card_' + ex.id;
    
    var html = '<div style="width: 100%;">';
    html += '<strong style="font-size:18.5px; color:#fd5e09; display:block; line-height: 1.25;">' + ex.name + '</strong>';
    html += '<div style="font-size:13.5px; color:#f59e0b; margin-top:3px; font-weight:700;">' + ex.target + ' <span class="rest-inline">' + (ex.restShort || "(90s)") + '</span></div>';
    html += '</div>';

    // Fila única: [Iniciar Aprox 1 / Serie 1] [Vídeo] [Series: 0/X]
    html += '<div class="exercise-controls-row">';
    var startLabel = plan.warmupSets > 0 ? ('Iniciar Aprox 1/' + plan.warmupSets) : ('Iniciar Serie 1/' + plan.workSets);
    html += '<button type="button" class="btn-link btn-action-start" id="' + ex.id + '_timerBtn" onclick="startCardTimer(\'' + ex.id + '\', \'' + ex.name.replace(/'/g, "\\'") + '\', ' + plan.warmupSets + ', ' + plan.workSets + ', ' + j + ', ' + (ex.restSecs || 90) + ')">⏱️ ' + startLabel + '</button>';
    html += '<button type="button" class="btn-link btn-action-video" id="' + ex.id + '_videoBtn" onclick="toggleInlineVideo(\'' + ex.id + '\')">' + (hasVideo ? '▶ Vídeo' : '📁 Vídeo') + '</button>';
    html += '<input type="file" id="' + ex.id + '_singleVideoInput" accept="video/*" style="display:none" onchange="handleSingleVideoUpload(\'' + ex.id + '\', event)">';
    html += '<span id="' + ex.id + '_seriesBadge" class="series-badge">Series: 0/' + plan.totalSets + '</span>';
    html += '</div>';

    // Línea de tiempo en tamaño mayor debajo, ocupando todo el ancho
    html += '<div id="' + ex.id + '_timerBadge" class="timer-badge" style="display:none;">⏱️ Ef: 00:00 | Real: 00:00</div>';

    // Caja de temporizador activo
    html += '<div class="card-timer-box" id="' + ex.id + '_timerBox">';
    html += '<div id="' + ex.id + '_timerSubtitle" style="color:#f59e0b; font-size:13px; font-weight:800; text-transform:uppercase; text-align:center; width:100%;">EN CURSO</div>';
    html += '<div class="card-timer-row">';
    html += '<div class="card-timer-clock" id="' + ex.id + '_timerClock">00:00</div>';
    html += '<div style="display:flex; gap:8px; flex: 1; justify-content: flex-end;">';
    html += '<button class="btn btn-save" id="' + ex.id + '_actionBtn" onclick="nextCardSeriesStep()" style="padding:10px 14px; font-size:14px; width:auto; flex:1;">Finalizar</button>';
    html += '<button class="btn btn-exit" id="' + ex.id + '_cancelBtn" onclick="cancelCardTimer(\'' + ex.id + '\')" style="padding:10px 14px; font-size:14px; width:auto;">✕</button>';
    html += '</div>';
    html += '</div>';
    html += '</div>';

    // Vídeo embebido
    html += '<div class="inline-video-wrapper" id="' + ex.id + '_videoWrapper"><video id="' + ex.id + '_video" loop autoplay muted playsinline controls></video></div>';

    // Tabla de series (A1, A2 para aproximaciones + S1..S4 para efectivas)
    html += '<div class="series-table-header">';
    html += '<div>Serie</div><div>Peso (kg)</div><div>Reps</div><div>RIR / Info</div>';
    html += '</div>';

    for (var s = 1; s <= plan.totalSets; s++) {
      var isWarmupRow = s <= plan.warmupSets;
      var badgeCode = isWarmupRow ? ('A' + s) : ('S' + (s - plan.warmupSets));
      var badgeClass = isWarmupRow ? 'series-num-warmup' : 'series-num-badge';

      var defaultRowWeight = isWarmupRow ? (ex.warmupWeight !== undefined ? ex.warmupWeight : 10) : (exData.weight !== undefined ? exData.weight : ex.defaultWeight);
      var defaultRowReps = isWarmupRow ? (ex.warmupReps || '25') : (exData.reps || ex.defaultReps);
      var defaultRowRir = isWarmupRow ? 'Aprox.' : '';

      var savedSet = (exData.sets && exData.sets[s - 1]) ? exData.sets[s - 1] : {
        weight: defaultRowWeight,
        reps: defaultRowReps,
        rir: defaultRowRir
      };

      html += '<div class="series-row">';
      html += '<div class="' + badgeClass + '">' + badgeCode + '</div>';
      
      html += '<div class="counter">';
      html += '<button type="button" onclick="adjustVal(\'' + ex.id + '_s' + s + '_weight\', -2.5)">-</button>';
      html += '<input type="number" step="0.5" id="' + ex.id + '_s' + s + '_weight" value="' + savedSet.weight + '">';
      html += '<button type="button" onclick="adjustVal(\'' + ex.id + '_s' + s + '_weight\', 2.5)">+</button>';
      html += '</div>';

      html += '<div><input type="text" class="row-input" id="' + ex.id + '_s' + s + '_reps" value="' + savedSet.reps + '" placeholder="Reps"></div>';
      html += '<div><input type="text" class="row-input" id="' + ex.id + '_s' + s + '_rir" value="' + (savedSet.rir || '') + '" placeholder="' + (isWarmupRow ? 'Aprox.' : 'RIR / Tempo') + '"></div>';
      html += '</div>';
    }

    html += '<div style="margin-top: 10px;">';
    html += '<label>Notas / Sensaciones del Ejercicio</label>';
    html += '<textarea rows="1" class="auto-notes" id="' + ex.id + '_notes" placeholder="Anota sensaciones, ajustes o técnica..." oninput="autoResizeNote(this)">' + (exData.notes || '') + '</textarea>';
    html += '</div>';

    card.innerHTML = html;
    container.appendChild(card);

    var noteEl = document.getElementById(ex.id + '_notes');
    if (noteEl && noteEl.value) autoResizeNote(noteEl);
  }
};

// 7. TEMPORIZADOR Y CONTROL DE SERIES (APROXIMACIÓN + EFECTIVAS)
// ==========================================
function clearAllActiveCardHighlights() {
  var allCards = document.querySelectorAll('.card-active');
  allCards.forEach(function(c) { c.classList.remove('card-active'); });
}

function beginActiveSeriesUI(exId, currentStep, warmupSets, workSets) {
  var sub = document.getElementById(exId + '_timerSubtitle');
  var clk = document.getElementById(exId + '_timerClock');
  var actBtn = document.getElementById(exId + '_actionBtn');

  var isWarm = currentStep <= warmupSets;
  var stepName = isWarm ? ("APROXIMACIÓN " + currentStep + " DE " + warmupSets) : ("SERIE EFECTIVA " + (currentStep - warmupSets) + " DE " + workSets);
  var btnName = isWarm ? ("Finalizar Aprox " + currentStep) : ("Finalizar Serie " + (currentStep - warmupSets));

  if (sub) { 
    sub.textContent = stepName + " EN CURSO"; 
    sub.style.color = isWarm ? "#38bdf8" : "#f59e0b"; 
  }
  if (clk) {
    clk.textContent = "00:00";
    clk.style.color = "#22c55e";
  }
  if (actBtn) {
    actBtn.style.display = 'inline-block';
    actBtn.textContent = btnName;
  }
}

function startCardTimer(exId, exName, warmupSets, workSets, exIndex, restSecs) {
  requestWakeLock();
  if (!sessionStartTime) sessionStartTime = Date.now();
  
  if (activeTimerState) {
    if (activeTimerState.interval) clearInterval(activeTimerState.interval);
    var oldBox = document.getElementById(activeTimerState.exId + '_timerBox');
    if (oldBox) oldBox.style.display = 'none';
  }

  clearAllActiveCardHighlights();
  var currentCard = document.getElementById('card_' + exId);
  if (currentCard) currentCard.classList.add('card-active');

  var totalSteps = warmupSets + workSets;

  activeTimerState = {
    exId: exId,
    exName: exName,
    warmupSets: warmupSets,
    workSets: workSets,
    totalSets: totalSteps,
    exIndex: exIndex,
    restSecsDefault: restSecs || 90,
    currentSet: 1,
    isResting: false,
    isInterExerciseRest: false,
    isPrepBeforeSet: false,
    prepOffsetSecs: 0,
    seconds: 0,
    restCountdown: 0,
    totalWorkSeconds: 0,
    totalRealSeconds: 0,
    interval: null
  };

  var timerBox = document.getElementById(exId + '_timerBox');
  if (timerBox) timerBox.style.display = 'flex';

  setTimeout(function() { lockCardToTop(exId); }, 100);
  beginActiveSeriesUI(exId, 1, warmupSets, workSets);

  var canBtn = document.getElementById(exId + '_cancelBtn');
  if (canBtn) canBtn.style.display = 'inline-block';

  activeTimerState.interval = setInterval(function() {
    if (!activeTimerState) return;
    activeTimerState.totalRealSeconds++;

    var clockEl = document.getElementById(activeTimerState.exId + '_timerClock');

    if (!activeTimerState.isResting && !activeTimerState.isInterExerciseRest) {
      activeTimerState.seconds++;
      activeTimerState.totalWorkSeconds++;
      if (clockEl) clockEl.textContent = formatTime(activeTimerState.seconds);
    } else {
      if (activeTimerState.restCountdown > 0) {
        activeTimerState.restCountdown--;
      }
      if (clockEl) clockEl.textContent = formatTime(activeTimerState.restCountdown);

      if (activeTimerState.restCountdown === 0) {
        if (activeTimerState.isPrepBeforeSet) {
          playAlarmSound();
          activeTimerState.isPrepBeforeSet = false;
          activeTimerState.isResting = false;
          activeTimerState.isInterExerciseRest = false;
          activeTimerState.seconds = 0;
          beginActiveSeriesUI(activeTimerState.exId, activeTimerState.currentSet, activeTimerState.warmupSets, activeTimerState.workSets);
        } else if (activeTimerState.isInterExerciseRest) {
          playAlarmSound();
          finishCardTimer(activeTimerState.exId);
        } else {
          playAlarmSound();
          activeTimerState.isResting = false;
          activeTimerState.seconds = 0;
          activeTimerState.currentSet++;
          beginActiveSeriesUI(activeTimerState.exId, activeTimerState.currentSet, activeTimerState.warmupSets, activeTimerState.workSets);
        }
      }
    }
  }, 1000);
}

function nextCardSeriesStep() {
  if (!activeTimerState) return;

  var exId = activeTimerState.exId;
  var warmupSets = activeTimerState.warmupSets;
  var workSets = activeTimerState.workSets;
  var totalSets = activeTimerState.totalSets;
  var seriesBadge = document.getElementById(exId + '_seriesBadge');

  if (activeTimerState.isPrepBeforeSet) {
    var remainingPrep = activeTimerState.restCountdown;
    activeTimerState.prepOffsetSecs += remainingPrep;
    activeTimerState.restCountdown = 0;
    activeTimerState.isPrepBeforeSet = false;
    activeTimerState.isResting = false;
    activeTimerState.isInterExerciseRest = false;
    activeTimerState.seconds = 0;
    beginActiveSeriesUI(exId, activeTimerState.currentSet, warmupSets, workSets);
    return;
  }

  if (!activeTimerState.isResting && !activeTimerState.isInterExerciseRest) {
    var offset = activeTimerState.prepOffsetSecs || 0;
    if (offset > 0) {
      var deducted = Math.min(activeTimerState.seconds, offset);
      activeTimerState.totalWorkSeconds = Math.max(1, activeTimerState.totalWorkSeconds - deducted);
    }

    if (seriesBadge) seriesBadge.textContent = "Series: " + activeTimerState.currentSet + "/" + totalSets;
    
    if (activeTimerState.currentSet < totalSets) {
      activeTimerState.isResting = true;
      // Si acaba una serie de aproximación, el descanso es corto (60s); si es efectiva, usa el descanso del ejercicio
      var isWarmFinished = activeTimerState.currentSet <= warmupSets;
      var baseRest = isWarmFinished ? 60 : activeTimerState.restSecsDefault;

      activeTimerState.restCountdown = baseRest + offset;
      activeTimerState.prepOffsetSecs = 0;

      var sub = document.getElementById(exId + '_timerSubtitle');
      var clk = document.getElementById(exId + '_timerClock');
      var actBtn = document.getElementById(exId + '_actionBtn');

      var finishedLabel = getStepLabel(activeTimerState.currentSet, warmupSets).toUpperCase();
      var nextStepLabel = getStepLabel(activeTimerState.currentSet + 1, warmupSets);
      var extraLabel = offset > 0 ? " (+" + offset + "s)" : "";

      if (sub) { sub.textContent = "DESCANSO TRAS " + finishedLabel + extraLabel; sub.style.color = "#38bdf8"; }
      if (clk) { clk.textContent = formatTime(activeTimerState.restCountdown); clk.style.color = "#38bdf8"; }
      if (actBtn) actBtn.textContent = "Empezar " + nextStepLabel;
    } else {
      // ÚLTIMA SERIE DEL EJERCICIO COMPLETADA -> PASAR AL DESCANSO DEL SIGUIENTE EJERCICIO
      var exIndex = activeTimerState.exIndex;
      finishCardTimer(exId);

      var daySelect = document.getElementById('daySelect');
      var currentDay = daySelect ? daySelect.value : "";
      var exercises = baseRoutines[currentDay] || [];

      if (exIndex + 1 < exercises.length) {
        var nextEx = exercises[exIndex + 1];
        var nextPlan = getExerciseSetPlan(nextEx);
        var exactInterRest = nextEx.restSecs || 90;
        startInterExerciseRestInCard(nextEx.id, nextEx.name, nextPlan.warmupSets, nextPlan.workSets, exIndex + 1, exactInterRest);
      }
    }
  } else {
    var remaining = activeTimerState.restCountdown;
    if (remaining > 0) {
      activeTimerState.prepOffsetSecs = remaining;
      activeTimerState.isPrepBeforeSet = true;
      if (!activeTimerState.isInterExerciseRest) {
        activeTimerState.currentSet++;
      }
      activeTimerState.isInterExerciseRest = false;

      var subPrep = document.getElementById(exId + '_timerSubtitle');
      var clkPrep = document.getElementById(exId + '_timerClock');
      var actBtnPrep = document.getElementById(exId + '_actionBtn');
      var stepNamePrep = getStepLabel(activeTimerState.currentSet, warmupSets).toUpperCase();

      if (subPrep) { 
        subPrep.textContent = "PREPARANDO " + stepNamePrep + " (FIN DESCANSO)"; 
        subPrep.style.color = "#facc15"; 
      }
      if (clkPrep) clkPrep.style.color = "#facc15";
      if (actBtnPrep) actBtnPrep.textContent = "Iniciar Ya (Saltar " + remaining + "s)";
    } else {
      activeTimerState.isResting = false;
      activeTimerState.isInterExerciseRest = false;
      activeTimerState.seconds = 0;
      if (!activeTimerState.isInterExerciseRest) {
        activeTimerState.currentSet++;
      }
      beginActiveSeriesUI(exId, activeTimerState.currentSet, warmupSets, workSets);
    }
  }
}

function startInterExerciseRestInCard(nextExId, nextExName, warmupSets, workSets, exIndex, restSecs) {
  clearAllActiveCardHighlights();
  var nextCard = document.getElementById('card_' + nextExId);
  if (nextCard) nextCard.classList.add('card-active');

  activeTimerState = {
    exId: nextExId,
    exName: nextExName,
    warmupSets: warmupSets,
    workSets: workSets,
    totalSets: warmupSets + workSets,
    exIndex: exIndex,
    restSecsDefault: restSecs,
    currentSet: 1,
    isResting: true,
    isInterExerciseRest: true,
    isPrepBeforeSet: false,
    prepOffsetSecs: 0,
    seconds: 0,
    restCountdown: restSecs,
    totalWorkSeconds: 0,
    totalRealSeconds: 0,
    interval: null
  };

  var timerBox = document.getElementById(nextExId + '_timerBox');
  if (timerBox) timerBox.style.display = 'flex';

  setTimeout(function() { lockCardToTop(nextExId); }, 100);

  var sub = document.getElementById(nextExId + '_timerSubtitle');
  if (sub) { sub.textContent = "DESCANSO ENTRE EJERCICIOS"; sub.style.color = "#38bdf8"; }

  var clk = document.getElementById(nextExId + '_timerClock');
  if (clk) { clk.textContent = formatTime(restSecs); clk.style.color = "#38bdf8"; }

  var actBtn = document.getElementById(nextExId + '_actionBtn');
  var canBtn = document.getElementById(nextExId + '_cancelBtn');
  if (actBtn) {
    actBtn.style.display = 'inline-block';
    actBtn.textContent = "Empezar " + getStepLabel(1, warmupSets);
  }
  if (canBtn) canBtn.style.display = 'inline-block';

  activeTimerState.interval = setInterval(function() {
    if (!activeTimerState) return;
    activeTimerState.totalRealSeconds++;

    if (activeTimerState.restCountdown > 0) {
      activeTimerState.restCountdown--;
    }
    var clkEl = document.getElementById(activeTimerState.exId + '_timerClock');
    if (clkEl) clkEl.textContent = formatTime(activeTimerState.restCountdown);

    if (activeTimerState.restCountdown === 0) {
      if (activeTimerState.isPrepBeforeSet) {
        playAlarmSound();
        activeTimerState.isPrepBeforeSet = false;
        activeTimerState.isResting = false;
        activeTimerState.isInterExerciseRest = false;
        activeTimerState.seconds = 0;
        beginActiveSeriesUI(activeTimerState.exId, activeTimerState.currentSet, activeTimerState.warmupSets, activeTimerState.workSets);
      } else {
        playAlarmSound();
        finishCardTimer(activeTimerState.exId);
      }
    }
  }, 1000);
}

function formatTime(secs) {
  var m = Math.floor(secs / 60);
  var s = Math.floor(secs % 60);
  return (m < 10 ? "0" + m : m) + ":" + (s < 10 ? "0" + s : s);
}

function finishCardTimer(exId) {
  if (activeTimerState && activeTimerState.interval) {
    clearInterval(activeTimerState.interval);
  }

  var workSecs = activeTimerState ? activeTimerState.totalWorkSeconds : 0;
  var realSecs = activeTimerState ? activeTimerState.totalRealSeconds : 0;
  var totalSets = activeTimerState ? activeTimerState.totalSets : 3;

  var effectiveStr = formatTime(workSecs);
  var realStr = formatTime(realSecs);

  if (workSecs > 0) {
    var timerBadge = document.getElementById(exId + '_timerBadge');
    if (timerBadge) {
      timerBadge.textContent = "⏱️ Ef: " + effectiveStr + " | Real: " + realStr;
      timerBadge.style.display = "flex";
    }

    var btn = document.getElementById(exId + '_timerBtn');
    if (btn) {
      btn.textContent = "✅ Completado (" + totalSets + "/" + totalSets + ")";
      btn.style.borderColor = "#22c55e";
      btn.style.color = "#22c55e";
    }
  }

  var timerBox = document.getElementById(exId + '_timerBox');
  if (timerBox) timerBox.style.display = 'none';

  clearAllActiveCardHighlights();
  activeTimerState = null;
}

function cancelCardTimer(exId) {
  if (activeTimerState && activeTimerState.interval) clearInterval(activeTimerState.interval);
  var timerBox = document.getElementById(exId + '_timerBox');
  if (timerBox) timerBox.style.display = 'none';
  clearAllActiveCardHighlights();
  activeTimerState = null;
}

function saveData(showAlert) {
  var daySelect = document.getElementById('daySelect');
  if (!daySelect) return false;
  var currentDay = daySelect.value;
  if (!currentDay) { 
    if(showAlert) alert("Por favor, selecciona primero un Bloque de Entreno."); 
    return false; 
  }

  var dateEl = document.getElementById('sessionDate');
  var date = dateEl ? dateEl.value : '';
  var exercises = baseRoutines[currentDay] || [];
  var sessionData = {};

  for (var k = 0; k < exercises.length; k++) {
    var ex = exercises[k];
    var plan = getExerciseSetPlan(ex);
    var setsArray = [];
    var maxEffectiveWeight = 0;
    var repsSummary = [];

    for (var s = 1; s <= plan.totalSets; s++) {
      var isWarmupRow = s <= plan.warmupSets;
      var wEl = document.getElementById(ex.id + '_s' + s + '_weight');
      var rEl = document.getElementById(ex.id + '_s' + s + '_reps');
      var rirEl = document.getElementById(ex.id + '_s' + s + '_rir');
      
      var wVal = wEl ? parseFloat(wEl.value) || 0 : 0;
      var rVal = rEl ? rEl.value : '';
      var rirVal = rirEl ? rirEl.value : '';

      // Calcular el peso máximo tomando solo las series efectivas (ignorando aproximaciones)
      if (!isWarmupRow && wVal > maxEffectiveWeight) {
        maxEffectiveWeight = wVal;
      }
      if (!isWarmupRow && rVal) {
        repsSummary.push(rVal);
      }

      setsArray.push({ 
        weight: wVal, 
        reps: rVal, 
        rir: rirVal,
        isWarmup: isWarmupRow,
        label: isWarmupRow ? ('A' + s) : ('S' + (s - plan.warmupSets))
      });
    }

    var notesEl = document.getElementById(ex.id + '_notes');
    var noteVal = notesEl ? notesEl.value : '';
    var timeBadge = document.getElementById(ex.id + '_timerBadge');
    var timeText = (timeBadge && timeBadge.style.display !== 'none') ? timeBadge.textContent : '';

    sessionData[ex.id] = {
      weight: maxEffectiveWeight,
      reps: repsSummary.join('-'),
      sets: setsArray,
      notes: noteVal,
      timeInfo: timeText,
      name: ex.name,
      exId: ex.id
    };
  }

  var totalSessionRealSecs = sessionStartTime ? Math.floor((Date.now() - sessionStartTime) / 1000) : 0;

  appData.history.push({ 
    date: date, 
    day: currentDay, 
    data: sessionData,
    sessionRealTime: formatTime(totalSessionRealSecs)
  });

  try { localStorage.setItem(STORAGE_KEY, JSON.stringify(appData)); } catch(e){}
  if(showAlert) alert("¡Sesión guardada con éxito!");
  return true;
}

function renderExerciseAnalysis() {
  var select = document.getElementById('exerciseCompareSelect');
  if (!select) return;
  var selectedExId = select.value;
  var container = document.getElementById('exerciseAnalysisContent');
  if (!container) return;
  container.innerHTML = '';

  var records = [];
  for (var h = 0; h < appData.history.length; h++) {
    var s = appData.history[h];
    if (s.data && s.data[selectedExId] && s.data[selectedExId].weight !== '') {
      records.push({ date: s.date, weight: parseFloat(s.data[selectedExId].weight) || 0 });
    }
  }

  if (records.length === 0) {
    container.innerHTML = '<p style="font-size:14px; color:#a1a1aa; text-align:center; padding:16px;">No hay datos guardados para este ejercicio.</p>';
    return;
  }

  var weights = records.map(function(r){ return r.weight; });
  var maxW = Math.max.apply(null, weights);
  var diff = weights[weights.length - 1] - weights[0];

  var resHtml = '<div style="background:#050201; padding:12px; border-radius:10px; border:1px solid #7c2d12; display:flex; justify-content:space-around; text-align:center; margin-top:10px;">';
  resHtml += '<div><div style="font-size:12px; color:#a1a1aa;">PESO MÁXIMO</div><div style="font-size:20px; font-weight:bold; color:#fd5e09;">' + maxW + ' kg</div></div>';
  resHtml += '<div><div style="font-size:12px; color:#a1a1aa;">INCREMENTO TOTAL</div><div style="font-size:20px; font-weight:bold; color:' + (diff >= 0 ? '#22c55e' : '#f87171') + ';">' + (diff >= 0 ? '+' : '') + diff + ' kg</div></div>';
  resHtml += '</div>';

  container.innerHTML = resHtml;
}

function loadHistoryModal() {
  var container = document.getElementById('historyList');
  if (!container) return;
  container.innerHTML = '';
  if(!appData.history || appData.history.length === 0) {
    container.innerHTML = '<p style="font-size:14px; color:#a1a1aa; text-align:center;">No hay sesiones guardadas aún. Puedes subir un archivo CSV guardado usando el botón inferior.</p>';
    return;
  }

  var reversed = appData.history.slice().reverse();
  for (var r = 0; r < reversed.length; r++) {
    var s = reversed[r];
    var originalIndex = appData.history.length - 1 - r;
    var item = document.createElement('div');
    item.style.cssText = 'background:#050201; padding:14px; border-radius:12px; border:1.5px solid #7c2d12; margin-bottom:12px; font-size:14px; position:relative;';
    
    var exercisesHtml = '';
    var keys = Object.keys(s.data);
    for (var k = 0; k < keys.length; k++) {
      var d = s.data[keys[k]];
      if (d.weight || (d.sets && d.sets.length > 0)) {
        exercisesHtml += '<div style="margin-bottom:8px; border-bottom:1px solid #1f0f04; padding-bottom:6px;">';
        exercisesHtml += '<div style="display:flex; justify-content:space-between;">';
        exercisesHtml += '<span style="font-weight:700; color:#f8fafc;">' + d.name + '</span>';
        exercisesHtml += '<span style="color:#fd5e09; font-weight:bold;">Max: ' + d.weight + ' kg</span>';
        exercisesHtml += '</div>';

        if (d.sets && d.sets.length > 0) {
          var setsDetail = d.sets.map(function(st, idx) {
            var code = st.label || ('S' + (idx + 1));
            return code + ': ' + st.weight + 'kg x ' + st.reps + (st.rir && st.rir !== 'Aprox.' ? ' (' + st.rir + ')' : '');
          }).join(' | ');
          exercisesHtml += '<div style="font-size:12px; color:#38bdf8; margin-top:2px;">' + setsDetail + '</div>';
        }

        if (d.timeInfo) {
          exercisesHtml += '<div style="font-size:12px; color:#22c55e; margin-top:2px;">' + d.timeInfo + '</div>';
        }

        if (d.notes) {
          exercisesHtml += '<div style="font-size:12px; color:#a1a1aa; margin-top:2px;">📝 ' + d.notes + '</div>';
        }
        exercisesHtml += '</div>';
      }
    }

    var headerHtml = '<div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:10px;">';
    headerHtml += '<span style="font-weight:bold; color:#f59e0b; font-size:15px;">📅 ' + s.date + ' - Día ' + s.day + (s.sessionRealTime ? ' (' + s.sessionRealTime + ')' : '') + '</span>';
    headerHtml += '<button type="button" class="btn-danger" onclick="deleteSession(' + originalIndex + ')">🗑️ Eliminar</button>';
    headerHtml += '</div>';

    item.innerHTML = headerHtml + '<div>' + exercisesHtml + '</div>';
    container.appendChild(item);
  }
}

function downloadCSV() {
  if(!appData.history || appData.history.length === 0) { alert("No hay datos para exportar."); return; }
  var csv = "Fecha,Bloque,ExId,Ejercicio,PesoMax_kg,Reps,Notas,Tiempo_Sesion,SeriesJSON\n";
  for (var i = 0; i < appData.history.length; i++) {
    var s = appData.history[i];
    var keys = Object.keys(s.data);
    for (var k = 0; k < keys.length; k++) {
      var d = s.data[keys[k]];
      var setsStr = JSON.stringify(d.sets || []).replace(/"/g, '""');
      var notesStr = (d.notes || '').replace(/"/g, '""');
      csv += '"' + s.date + '","' + s.day + '","' + (d.exId || keys[k]) + '","' + d.name + '","' + d.weight + '","' + d.reps + '","' + notesStr + '","' + (s.sessionRealTime || '') + '","' + setsStr + '"\n';
    }
  }

  var blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
  var url = window.URL.createObjectURL(blob);
  var a = document.createElement('a');
  a.href = url;
  a.download = 'Historial_Gimnasio.csv';
  a.click();
}

function findExerciseByNameOrId(day, exId, exName) {
  var list = baseRoutines[day] || [];
  for (var i = 0; i < list.length; i++) {
    if (list[i].id === exId) return list[i];
  }
  var cleanName = (exName || '').toLowerCase().trim();
  for (var j = 0; j < list.length; j++) {
    if (list[j].name.toLowerCase().trim() === cleanName || list[j].name.toLowerCase().includes(cleanName)) {
      return list[j];
    }
  }
  return null;
}

function importCSV(e) {
  var file = e.target.files[0];
  if (!file) return;

  var reader = new FileReader();
  reader.onload = function(evt) {
    try {
      var text = evt.target.result;
      var lines = text.split(/\r?\n/);
      if (lines.length < 2) {
        alert("El archivo CSV está vacío.");
        return;
      }

      var header = lines[0].toLowerCase();
      var isLegacyFormat = header.indexOf('exid') === -1;

      var sessionsMap = {};
      for (var i = 1; i < lines.length; i++) {
        var line = lines[i].trim();
        if (!line) continue;

        var cols = [];
        var inQuotes = false;
        var current = '';
        for (var c = 0; c < line.length; c++) {
          var ch = line[c];
          if (ch === '"' && line[c + 1] === '"') {
            current += '"';
            c++;
          } else if (ch === '"') {
            inQuotes = !inQuotes;
          } else if (ch === ',' && !inQuotes) {
            cols.push(current);
            current = '';
          } else {
            current += ch;
          }
        }
        cols.push(current);

        var date, day, exId, name, weight, reps, notes, sessionRealTime, sets = [];

        if (isLegacyFormat && cols.length >= 5) {
          date = cols[0];
          day = cols[1].replace(/Bloque\s*|Día\s*/i, '').trim();
          name = cols[2];
          weight = parseFloat(cols[3]) || 0;
          reps = cols[4] || '';
          notes = cols[5] || '';
          sessionRealTime = cols[6] || '';

          var matchedEx = findExerciseByNameOrId(day, '', name);
          exId = matchedEx ? matchedEx.id : ('d' + day + '_custom_' + i);
          var plan = matchedEx ? getExerciseSetPlan(matchedEx) : { totalSets: 3, warmupSets: 0 };
          var repsArr = reps.split('-');
          for (var s = 0; s < plan.totalSets; s++) {
            sets.push({
              weight: weight,
              reps: repsArr[s] || repsArr[0] || reps,
              rir: ''
            });
          }
        } else if (!isLegacyFormat && cols.length >= 6) {
          date = cols[0];
          day = cols[1].replace(/Bloque\s*|Día\s*/i, '').trim();
          exId = cols[2];
          name = cols[3];
          weight = parseFloat(cols[4]) || 0;
          reps = cols[5] || '';
          notes = cols[6] || '';
          sessionRealTime = cols[7] || '';
          if (cols[8]) {
            try { sets = JSON.parse(cols[8]); } catch(err){}
          }
        } else {
          continue;
        }

        var sessionKey = date + '_' + day;
        if (!sessionsMap[sessionKey]) {
          sessionsMap[sessionKey] = {
            date: date,
            day: day,
            data: {},
            sessionRealTime: sessionRealTime
          };
        }

        sessionsMap[sessionKey].data[exId] = {
          exId: exId,
          name: name,
          weight: weight,
          reps: reps,
          notes: notes,
          sets: sets
        };
      }

      var importedSessions = Object.values(sessionsMap);
      if (importedSessions.length === 0) {
        alert("No se pudieron leer sesiones válidas en el CSV.");
        return;
      }

      appData.history = appData.history.concat(importedSessions);
      localStorage.setItem(STORAGE_KEY, JSON.stringify(appData));
      loadHistoryModal();
      window.renderExercises();
      alert("¡Progreso restaurado con éxito! Se han importado " + importedSessions.length + " sesiones.");
    } catch (err) {
      alert("Error al importar el CSV: " + err.message);
    }
  };
  reader.readAsText(file);
}
