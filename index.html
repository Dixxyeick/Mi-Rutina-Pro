<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#0f172a">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="RutinaPro">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Mi Rutina Pro</title>

<!-- MANIFEST AUTOCONTENIDO CON ICONO EN EMBED -->
<link rel="manifest" href='data:application/manifest+json,{"name":"Mi Rutina Pro","short_name":"RutinaPro","start_url":"./index.html","display":"standalone","background_color":"#0f172a","theme_color":"#0f172a","icons":[{"src":"https://cdn-icons-png.flaticon.com/512/2964/2964514.png","sizes":"192x192 512x512","type":"image/png"}]}'>
<link rel="icon" type="image/png" href="https://cdn-icons-png.flaticon.com/512/2964/2964514.png">

<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.min.js"></script>
<script>
  if (window.pdfjsLib) {
    pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.worker.min.js';
  }
</script>
<style>
  body { font-family: system-ui, -apple-system, sans-serif; background-color: #0f172a; color: #f8fafc; margin: 0; padding: 18px; padding-bottom: 40px; }
  header { background-color: #1e293b; padding: 16px; border-radius: 14px; margin-bottom: 18px; display: flex; justify-content: space-between; align-items: center; border: 1px solid #334155; }
  h1 { color: #38bdf8; margin: 0; font-size: 22px; font-weight: bold; }
  .subtitle { font-size: 13px; color: #94a3b8; margin-top: 2px; }
  .card { background-color: #1e293b; padding: 16px; border-radius: 14px; margin-bottom: 14px; border: 1px solid #334155; }
  label { font-size: 13px; color: #94a3b8; display: block; margin-bottom: 6px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.5px; }
  select, input { background-color: #0f172a; color: #fff; border: 1px solid #334155; padding: 12px; border-radius: 10px; width: 100%; box-sizing: border-box; font-size: 16px; font-weight: 600; }
  input[type=number]::-webkit-inner-spin-button, input[type=number]::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }
  input[type=number] { -moz-appearance: textfield; }
  .grid { display: grid; grid-template-columns: 5fr 4fr 3fr; gap: 8px; margin-top: 12px; align-items: center; }
  .counter { display: flex; align-items: center; background-color: #0f172a; border-radius: 10px; border: 1px solid #334155; }
  .counter button { width: 36px; height: 44px; background: #1e293b; color: #38bdf8; border: none; font-size: 18px; font-weight: bold; cursor: pointer; border-radius: 8px; }
  .counter input { border: none; text-align: center; color: #38bdf8; font-size: 17px; font-weight: bold; padding: 6px; }
  .btn { background-color: #0284c7; color: white; border: none; padding: 14px; border-radius: 12px; font-weight: bold; width: 100%; cursor: pointer; font-size: 16px; }
  .btn-save { background-color: #059669; }
  .btn-pdf { background-color: #0284c7; padding: 8px 14px; font-size: 13px; border-radius: 8px; cursor: pointer; display: inline-block; font-weight: bold; }
  .btn-del { background-color: rgba(244, 63, 94, 0.15); color: #fb7185; border: 1px solid rgba(244, 63, 94, 0.3); padding: 6px 10px; border-radius: 6px; font-size: 12px; font-weight: bold; cursor: pointer; float: right; }
  .btn-link { background-color: rgba(56, 189, 248, 0.15); color: #38bdf8; border: 1px solid rgba(56, 189, 248, 0.3); text-decoration: none; padding: 6px 10px; border-radius: 8px; font-size: 13px; font-weight: bold; }
  .modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.88); z-index: 100; padding: 16px; align-items: center; justify-content: center; }
  .modal-content { background: #1e293b; border: 1px solid #334155; border-radius: 18px; padding: 20px; max-width: 650px; width: 100%; max-height: 88vh; overflow-y: auto; box-sizing: border-box; }
  .bar-container { background: #0f172a; border-radius: 8px; height: 18px; width: 100%; margin-top: 4px; overflow: hidden; display: flex; }
  .bar-fill { background: #0284c7; height: 100%; transition: width 0.3s; }
</style>
</head>
<body>

<header>
  <div>
    <h1>Mi Rutina Pro</h1>
    <div class="subtitle">Análisis, Vídeos y Comparativas</div>
  </div>
  <div>
    <label class="btn-pdf">
      📄 Cargar PDF
      <input type="file" id="pdfInput" accept="application/pdf" style="display:none" onchange="processPDF(event)">
    </label>
  </div>
</header>

<div class="card">
  <div style="display: flex; gap: 10px;">
    <div style="flex: 1;">
      <label>Fecha de Hoy</label>
      <input type="date" id="sessionDate">
    </div>
    <div style="flex: 1.2;">
      <label>Día de Entreno</label>
      <select id="daySelect" onchange="renderExercises()">
        <option value="">-- Seleccionar Día --</option>
        <option value="1">DÍA 1 - Fuerza Basal</option>
        <option value="2">DÍA 2 - Cadena Posterior y Tracción</option>
        <option value="3">DÍA 3 - Cadera, Detalle y Aislamiento</option>
      </select>
    </div>
  </div>
</div>

<div id="exercisesContainer">
  <p style="text-align:center; color:#94a3b8; padding: 24px; font-size: 15px;">👆 Selecciona una opción en <strong>Día de Entreno</strong> para cargar los ejercicios.</p>
</div>

<div style="display: flex; gap: 10px; margin-top: 18px;">
  <button class="btn btn-save" style="flex: 1.5;" onclick="saveData()">💾 Guardar Sesión</button>
  <button class="btn" style="flex: 1;" onclick="toggleModal(true)">📁 Historial / Comparativa</button>
</div>

<!-- MODAL DE HISTORIAL Y COMPARATIVA -->
<div id="historyModal" class="modal">
  <div class="modal-content">
    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px;">
      <h2 style="margin:0; font-size:18px; color:#38bdf8;">📊 Historial y Comparativa</h2>
      <button style="background:none; border:none; color:#94a3b8; font-size:24px; cursor:pointer; width:auto; margin:0;" onclick="toggleModal(false)">✕</button>
    </div>
    <div id="historyList"></div>
    <div style="margin-top: 18px; border-top: 1px solid #334155; padding-top: 14px; text-align: right;">
      <button class="btn btn-save" style="width: auto; padding: 10px 18px; font-size: 13px;" onclick="downloadCSV()">⬇️ Exportar CSV</button>
    </div>
  </div>
</div>

<script>
if ('serviceWorker' in navigator) {
  const swCode = `
    self.addEventListener('install', e => self.skipWaiting());
    self.addEventListener('fetch', e => e.respondWith(fetch(e.request).catch(() => caches.match(e.request))));
  `;
  const blob = new Blob([swCode], { type: 'application/javascript' });
  navigator.serviceWorker.register(URL.createObjectURL(blob)).catch(() => {});
}

const baseRoutines = {
  "1": [
    { id: "d1_e1", name: "1. Prensa inclinada (Cuádriceps)", target: "3 series x 8-10 rep.", defaultWeight: 120, defaultReps: "10-10-8" },
    { id: "d1_e2", name: "2. Femoral sentado", target: "3 series x 8-10 rep.", defaultWeight: 50, defaultReps: "10-10-8" },
    { id: "d1_e3", name: "3. Press inclinado en palancas", target: "3 series x 6-8 rep.", defaultWeight: 60, defaultReps: "8-8-6" },
    { id: "d1_e4", name: "4. Jalón neutro en palancas", target: "3 series x 8-10 rep.", defaultWeight: 55, defaultReps: "10-10-8" },
    { id: "d1_e5", name: "5. Press de hombro máquina palancas", target: "2 series x 8-10 rep.", defaultWeight: 40, defaultReps: "10-8" },
    { id: "d1_e6", name: "6. Fondos en máquina de placas", target: "2 series x 10-12 rep.", defaultWeight: 65, defaultReps: "12-10" },
    { id: "d1_e7", name: "7. Curl de bíceps", target: "2 series x 10-12 rep.", defaultWeight: 14, defaultReps: "12-10" },
    { id: "d1_e8", name: "8. Abdominal inferior", target: "2-3 series x 12-15 rep.", defaultWeight: 0, defaultReps: "15-15-12" },
    { id: "d1_e9", name: "9. Gemelo de pie (Opcional)", target: "3 series x 10-12 rep.", defaultWeight: 70, defaultReps: "12-12-10" }
  ],
  "2": [
    { id: "d2_e1", name: "1. Hack pies juntos (Cuádriceps)", target: "3 series x 8-10 rep.", defaultWeight: 80, defaultReps: "10-10-8" },
    { id: "d2_e2", name: "2. Peso muerto rumano (Femoral)", target: "3 series x 6-8 rep.", defaultWeight: 90, defaultReps: "8-8-6" },
    { id: "d2_e3", name: "3. Remo en punta o Multipower", target: "3 series x 8-10 rep.", defaultWeight: 50, defaultReps: "10-10-8" },
    { id: "d2_e4", name: "4. Aperturas en palancas", target: "2 series x 10-12 rep.", defaultWeight: 45, defaultReps: "12-10" },
    { id: "d2_e5", name: "5. Elevaciones máquina disco laterales", target: "3 series x 10-12 rep.", defaultWeight: 10, defaultReps: "12-12-10" },
    { id: "d2_e6", name: "6. Gemelo de pie", target: "3 series x 10-12 rep.", defaultWeight: 75, defaultReps: "12-12-10" },
    { id: "d2_e7", name: "7. Curl inverso para antebrazo", target: "2 series x 10-12 rep.", defaultWeight: 20, defaultReps: "12-10" },
    { id: "d2_e8", name: "8. Hiperextensiones lumbares", target: "2 series x 10-12 rep.", defaultWeight: 10, defaultReps: "12-10" }
  ],
  "3": [
    { id: "d3_e1", name: "1. Hip Thrust (Glúteo)", target: "3 series x 8-10 rep.", defaultWeight: 100, defaultReps: "10-10-8" },
    { id: "d3_e2", name: "2. Extensiones de cuádriceps", target: "2 series x 10-12 rep.", defaultWeight: 60, defaultReps: "12-10" },
    { id: "d3_e3", name: "3. Pullover en polea alta", target: "3 series x 10-12 rep.", defaultWeight: 35, defaultReps: "12-12-10" },
    { id: "d3_e4", name: "4. Press de hombro máquina palancas", target: "3 series x 8-10 rep.", defaultWeight: 40, defaultReps: "10-10-8" },
    { id: "d3_e5", name: "5. Extensión de tríceps agarre ancho", target: "2 series x 10-12 rep.", defaultWeight: 30, defaultReps: "12-10" },
    { id: "d3_e6", name: "6. Curl de bíceps en polea UVE", target: "2 series x 10-12 rep.", defaultWeight: 25, defaultReps: "12-10" },
    { id: "d3_e7", name: "7. Aductores cerrar en máquina", target: "2 series x 12-15 rep.", defaultWeight: 50, defaultReps: "15-12" },
    { id: "d3_e8", name: "8. Abdominal superior", target: "2 series x 15-20 rep.", defaultWeight: 0, defaultReps: "20-15" }
  ]
};

let appData = { videoUrls: {}, history: [] };
try {
  const saved = localStorage.getItem('gym_routine_pro_data');
  if (saved) appData = JSON.parse(saved);
  if (!appData.history) appData.history = [];
  if (!appData.videoUrls) appData.videoUrls = {};
} catch(e){}

function initApp() {
  const dateInput = document.getElementById('sessionDate');
  if (dateInput && !dateInput.value) {
    const today = new Date().toISOString().split('T')[0];
    dateInput.value = today;
  }
  renderExercises();
}

function renderExercises() {
  const currentDay = document.getElementById('daySelect').value;
  const container = document.getElementById('exercisesContainer');
  container.innerHTML = '';
  
  if (!currentDay || !baseRoutines[currentDay]) {
    container.innerHTML = '<p style="text-align:center; color:#94a3b8; padding: 24px; font-size: 15px;">👆 Selecciona una opción en <strong>Día de Entreno</strong> para cargar los ejercicios.</p>';
    return;
  }
  
  const exercises = baseRoutines[currentDay];
  const lastSession = appData.history.filter(s => String(s.day) === String(currentDay)).pop() || { data: {} };

  exercises.forEach(ex => {
    const exData = (lastSession.data && lastSession.data[ex.id]) ? lastSession.data[ex.id] : { weight: ex.defaultWeight, reps: ex.defaultReps, notes: '' };
    const videoUrl = appData.videoUrls[ex.id] || "";

    const card = document.createElement('div');
    card.className = "card";
    card.innerHTML = `
      <div style="display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 8px;">
        <div>
          <strong style="font-size:16px; color:#f8fafc;">${ex.name}</strong>
          <div style="font-size:12px; color:#38bdf8; margin-top:2px;">${ex.target}</div>
        </div>
        <div>
          ${videoUrl ? `<a href="${videoUrl}" target="_blank" class="btn-link">▶ Vídeo</a>` : `<button onclick="promptVideoUrl('${ex.id}')" style="background:#334155; color:#cbd5e1; border:none; padding:6px 10px; border-radius:6px; font-size:12px; cursor:pointer;">+ Enlace</button>`}
        </div>
      </div>
      <div class="grid">
        <div>
          <label>Peso (kg)</label>
          <div class="counter">
            <button type="button" onclick="adjustVal('${ex.id}_weight', -2.5)">-</button>
            <input type="number" step="0.5" id="${ex.id}_weight" value="${exData.weight !== undefined ? exData.weight : ex.defaultWeight}" placeholder="0">
            <button type="button" onclick="adjustVal('${ex.id}_weight', 2.5)">+</button>
          </div>
        </div>
        <div>
          <label>Reps / Series</label>
          <input type="text" id="${ex.id}_reps" value="${exData.reps || ex.defaultReps}" placeholder="ej. 10-10-8">
        </div>
        <div>
          <label>Notas</label>
          <input type="text" id="${ex.id}_notes" value="${exData.notes || ''}" placeholder="RPE 8">
        </div>
      </div>
    `;
    container.appendChild(card);
  });
}

function adjustVal(inputId, amount) {
  const el = document.getElementById(inputId);
  if (!el) return;
  let val = parseFloat(el.value) || 0;
  el.value = Math.max(0, val + amount);
}

function saveData() {
  const currentDay = document.getElementById('daySelect').value;
  if (!currentDay) { alert("Por favor, selecciona primero un Día de Entreno."); return; }

  const date = document.getElementById('sessionDate').value;
  const exercises = baseRoutines[currentDay] || [];
  const sessionData = {};

  exercises.forEach(ex => {
    const weightEl = document.getElementById(`${ex.id}_weight`);
    const repsEl = document.getElementById(`${ex.id}_reps`);
    const notesEl = document.getElementById(`${ex.id}_notes`);
    sessionData[ex.id] = {
      weight: weightEl ? weightEl.value : '',
      reps: repsEl ? repsEl.value : '',
      notes: notesEl ? notesEl.value : '',
      name: ex.name
    };
  });

  const existingIdx = appData.history.findIndex(s => String(s.day) === String(currentDay) && s.date === date);
  if (existingIdx !== -1) {
    appData.history[existingIdx].data = sessionData;
  } else {
    appData.history.push({ date, day: currentDay, data: sessionData });
  }

  localStorage.setItem('gym_routine_pro_data', JSON.stringify(appData));
  alert("¡Sesión guardada con éxito!");
}

function deleteRecord(index) {
  if (confirm("¿Seguro que deseas eliminar este registro del historial?")) {
    appData.history.splice(index, 1);
    localStorage.setItem('gym_routine_pro_data', JSON.stringify(appData));
    loadHistoryModal();
  }
}

function promptVideoUrl(exId) {
  const url = prompt("Introduce la URL del vídeo para este ejercicio:");
  if (url) {
    appData.videoUrls[exId] = url;
    localStorage.setItem('gym_routine_pro_data', JSON.stringify(appData));
    renderExercises();
  }
}

function toggleModal(show) {
  const m = document.getElementById('historyModal');
  m.style.display = show ? 'flex' : 'none';
  if (show) loadHistoryModal();
}

function loadHistoryModal() {
  const container = document.getElementById('historyList');
  container.innerHTML = '';
  if(!appData.history || appData.history.length === 0) {
    container.innerHTML = '<p style="font-size:14px; color:#94a3b8; text-align:center;">No hay sesiones guardadas aún.</p>';
    return;
  }

  // Calcular pesos máximos para gráficos
  let maxWeights = {};
  appData.history.forEach(s => {
    Object.keys(s.data).forEach(exId => {
      let w = parseFloat(s.data[exId].weight) || 0;
      if (!maxWeights[exId] || w > maxWeights[exId]) maxWeights[exId] = w;
    });
  });

  appData.history.slice().reverse().forEach((s, revIdx) => {
    const originalIdx = appData.history.length - 1 - revIdx;
    const item = document.createElement('div');
    item.style.cssText = 'background:#0f172a; padding:14px; border-radius:12px; border:1px solid #334155; margin-bottom:12px; font-size:13px;';
    
    let exercisesHtml = Object.values(s.data).map(d => {
      if(!d.weight) return '';
      let currentW = parseFloat(d.weight) || 0;
      let maxW = maxWeights[d.exId] || currentW || 100;
      let pct = Math.min(100, Math.round((currentW / maxW) * 100));
      return `
        <div style="margin-bottom: 8px;">
          <div style="display:flex; justify-content:space-between;">
            <span style="font-weight:600; color:#f8fafc;">${d.name}</span>
            <span style="color:#38bdf8; font-weight:bold;">${d.weight} kg (${d.reps || 'reps N/A'})</span>
          </div>
          <div class="bar-container">
            <div class="bar-fill" style="width: ${pct}%;"></div>
          </div>
        </div>
      `;
    }).filter(Boolean).join('');

    item.innerHTML = `
      <div style="font-weight:bold; color:#38bdf8; font-size:14px; margin-bottom:10px; display:flex; justify-content:space-between; align-items:center; border-bottom:1px solid #1e293b; padding-bottom:6px;">
        <span>📅 ${s.date} - Día ${s.day}</span>
        <button class="btn-del" onclick="deleteRecord(${originalIdx})">🗑️ Borrar</button>
      </div>
      <div>${exercisesHtml}</div>
    `;
    container.appendChild(item);
  });
}

function downloadCSV() {
  if(!appData.history || appData.history.length === 0) { alert("No hay datos para exportar."); return; }
  let csv = "Fecha,Dia,Ejercicio,Peso_kg,Reps,Notas\n";
  appData.history.forEach(s => {
    Object.keys(s.data).forEach(exId => {
      const d = s.data[exId];
      if(d.weight) {
        csv += `"${s.date}","Día ${s.day}","${d.name}","${d.weight}","${d.reps}","${d.notes}"\n`;
      }
    });
  });

  const blob = new Blob([csv], { type: 'text/csv' });
  const url = window.URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `Historial_Gimnasio_${new Date().toISOString().slice(0,10)}.csv`;
  a.click();
}

async function processPDF(event) {
  const file = event.target.files[0];
  if (!file) return;
  try {
    const arrayBuffer = await file.arrayBuffer();
    const pdf = await pdfjsLib.getDocument({ data: arrayBuffer }).promise;
    let foundLinks = [];
    for (let i = 1; i <= pdf.numPages; i++) {
      const page = await pdf.getPage(i);
      const annotations = await page.getAnnotations();
      annotations.forEach(ann => { if (ann.url) foundLinks.push(ann.url); });
    }
    if (foundLinks.length > 0) {
      let linkIdx = 0;
      Object.keys(baseRoutines).forEach(day => {
        baseRoutines[day].forEach(ex => {
          if (linkIdx < foundLinks.length) {
            appData.videoUrls[ex.id] = foundLinks[linkIdx];
            linkIdx++;
          }
        });
      });
      localStorage.setItem('gym_routine_pro_data', JSON.stringify(appData));
      alert(`¡Se extrajeron ${foundLinks.length} enlaces del PDF con éxito!`);
      renderExercises();
    } else {
      alert("No se encontraron hipervínculos dentro del PDF.");
    }
  } catch (err) {
    alert("Error al leer el archivo PDF.");
  }
}

window.addEventListener('DOMContentLoaded', initApp);
window.addEventListener('load', initApp);
</script>
</body>
</html>
