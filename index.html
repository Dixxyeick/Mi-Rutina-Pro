<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mi Rutina Pro</title>
<style>
  body { font-family: system-ui, -apple-system, sans-serif; background-color: #0f172a; color: #f8fafc; margin: 0; padding: 16px; }
  header { background-color: #1e293b; padding: 12px; border-radius: 8px; margin-bottom: 16px; text-align: center; }
  h1 { color: #38bdf8; margin: 0; font-size: 20px; }
  .card { background-color: #1e293b; padding: 12px; border-radius: 8px; margin-bottom: 12px; border: 1px solid #334155; }
  label { font-size: 12px; color: #94a3b8; display: block; margin-bottom: 4px; }
  select, input { background-color: #0f172a; color: #fff; border: 1px solid #334155; padding: 8px; border-radius: 6px; width: 100%; box-sizing: border-box; font-size: 14px; }
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 8px; }
  button { background-color: #0284c7; color: white; border: none; padding: 10px; border-radius: 6px; font-weight: bold; width: 100%; margin-top: 8px; cursor: pointer; }
  .btn-save { background-color: #059669; }
  .btn-hist { background-color: #0284c7; }
</style>
</head>
<body>

<header>
  <h1>Mi Rutina de Gimnasio</h1>
</header>

<div class="card">
  <label>Fecha de Hoy</label>
  <input type="date" id="sessionDate">
  
  <label style="margin-top:10px;">Día de Entreno</label>
  <select id="daySelect" onchange="renderExercises()">
    <option value="">-- Seleccionar Día --</option>
    <option value="1">DÍA 1 - Fuerza Basal</option>
    <option value="2">DÍA 2 - Cadena Posterior y Tracción</option>
    <option value="3">DÍA 3 - Cadera, Detalle y Aislamiento</option>
  </select>
</div>

<div id="exercisesContainer">
  <p style="text-align:center; color:#94a3b8; padding: 20px;">👆 Selecciona un día arriba para cargar los ejercicios.</p>
</div>

<div style="margin-top: 16px;">
  <button class="btn-save" onclick="saveData()">💾 Guardar Sesión</button>
  <button class="btn-hist" onclick="showHistory()">📁 Ver Historial</button>
</div>

<script>
const routines = {
  "1": ["1. Prensa inclinada", "2. Femoral sentado", "3. Press inclinado palancas", "4. Jalón neutro", "5. Press hombro máquina", "6. Fondos máquina", "7. Curl de bíceps", "8. Abdominal inferior"],
  "2": ["1. Hack pies juntos", "2. Peso muerto rumano", "3. Remo en punta", "4. Aperturas en palancas", "5. Elevaciones máquina", "6. Gemelo de pie", "7. Curl inverso", "8. Hiperextensiones"],
  "3": ["1. Hip Thrust", "2. Extensiones cuádriceps", "3. Pullover polea", "4. Press hombro", "5. Extensión tríceps", "6. Curl bíceps UVE", "7. Aductores máquina", "8. Abdominal superior"]
};

document.getElementById('sessionDate').valueAsDate = new Date();

function renderExercises() {
  const day = document.getElementById('daySelect').value;
  const container = document.getElementById('exercisesContainer');
  container.innerHTML = '';
  
  if (!day || !routines[day]) {
    container.innerHTML = '<p style="text-align:center; color:#94a3b8; padding: 20px;">👆 Selecciona un día arriba para cargar los ejercicios.</p>';
    return;
  }
  
  routines[day].forEach((ex, idx) => {
    const card = document.createElement('div');
    card.className = 'card';
    card.innerHTML = `
      <strong>${ex}</strong>
      <div class="grid">
        <div>
          <label>Peso (kg)</label>
          <input type="number" id="w_${idx}" placeholder="0">
        </div>
        <div>
          <label>Reps / Series</label>
          <input type="text" id="r_${idx}" placeholder="ej. 10-10-8">
        </div>
      </div>
    `;
    container.appendChild(card);
  });
}

function saveData() {
  const day = document.getElementById('daySelect').value;
  if(!day) { alert("Selecciona un día."); return; }
  const date = document.getElementById('sessionDate').value;
  
  const data = {};
  routines[day].forEach((ex, idx) => {
    const w = document.getElementById(`w_${idx}`).value;
    const r = document.getElementById(`r_${idx}`).value;
    data[ex] = { weight: w, reps: r };
  });
  
  let history = JSON.parse(localStorage.getItem('gym_simple_history')) || [];
  history.push({ date, day, data });
  localStorage.setItem('gym_simple_history', JSON.stringify(history));
  alert("¡Sesión guardada correctamente!");
}

function showHistory() {
  let history = JSON.parse(localStorage.getItem('gym_simple_history')) || [];
  if(history.length === 0) { alert("No hay datos guardados aún."); return; }
  let msg = "HISTORIAL DE ENTRENAMIENTOS:\n\n";
  history.forEach(h => {
    msg += `📅 ${h.date} (Día ${h.day})\n`;
    Object.keys(h.data).forEach(k => {
      if(h.data[k].weight) msg += `  • ${k}: ${h.data[k].weight} kg (${h.data[k].reps})\n`;
    });
    msg += "\n";
  });
  alert(msg);
}
</script>
</body>
</html>
