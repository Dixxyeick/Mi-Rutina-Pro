    background-image: linear-gradient(rgba(10, 5, 1, 0.88), rgba(20, 10, 2, 0.94)), url('./icono.png');
    background-repeat: no-repeat;
    background-position: center center;
    background-size: cover;
    background-attachment: fixed;
    color: #f8fafc; 
    margin: 0; 
    padding: 16px; 
    padding-bottom: 50px; 
  }

  .btn-fullscreen { 
    position: fixed; 
    top: 8px;

    background: transparent; 
    color: rgba(255, 255, 255, 0.08); 
    border: none; 
    width: 35px; 
    height: 35px; 
    font-size: 18px; 
    cursor: pointer; 
    z-index: 99; 
  }

  .logo-container {
    width: 100%;
    aspect-ratio: 1 / 1.15;
    margin-top: 10px;
    margin-bottom: 12px;

    box-shadow: 0 4px 20px rgba(253, 94, 9, 0.4);
    overflow: hidden;
    background-color: #050201;
    position: relative;
    box-sizing: border-box;
  }

  .logo-img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    object-position: center top;
    display: block;
  }

  .header-actions-left {
    position: absolute;
    bottom: 12px;
    left: 12px;
    z-index: 2;
  }

  .header-actions-right {
    position: absolute;
    bottom: 12px;
    right: 12px;
    z-index: 2;
  }

  .sticky-player {
