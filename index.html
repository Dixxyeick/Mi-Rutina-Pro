    { id: "d1_e2", name: "2. Femoral sentado", target: "3 series x 8-10 rep.", defaultWeight: 35, defaultReps: "10" },
    { id: "d1_e3", name: "3. Press inclinado en palancas", target: "3 series x 6-8 rep.", defaultWeight: 35, defaultReps: "8" },
    { id: "d1_e4", name: "4. Jalón neutro en palancas", target: "3 series x 8-10 rep.", defaultWeight: 30, defaultReps: "10" },
    { id: "d1_e5", name: "5. Press de hombro máquina palancas de discos sentado", target: "2 series x 8-10 rep.", defaultWeight: 15, defaultReps: "10" },
    { id: "d1_e6", name: "6. Fondos en máquina de placas", target: "2 series x 10-12 rep.", defaultWeight: 30, defaultReps: "12" },
    { id: "d1_e7", name: "7. Curl de bíceps", target: "2 series x 10-12 rep.", defaultWeight: 25, defaultReps: "12" },
    { id: "d1_e8", name: "8. Abdominal inferior", target: "3 series x 12-15 rep.", defaultWeight: 0, defaultReps: "15" },
    { id: "d1_e9", name: "9. Gemelo de pie (Opcional)", target: "3 series x 10-12 rep.", defaultWeight: 40, defaultReps: "12" }
  ],
  "2": [
    { id: "d2_e1", name: "1. Hack pies juntos - Cuádriceps", target: "3 series x 8-10 rep.", defaultWeight: 20, defaultReps: "10" },
    { id: "d2_e2", name: "2. Peso muerto rumano - Femoral", target: "3 series x 6-8 rep.", defaultWeight: 20, defaultReps: "8" },
    { id: "d2_e3", name: "3. Remo en punta o Multipower", target: "3 series x 8-10 rep.", defaultWeight: 20, defaultReps: "10" },
    { id: "d2_e4", name: "4. Aperturas en palancas", target: "2 series x 10-12 rep.", defaultWeight: 30, defaultReps: "12" },
    { id: "d2_e5", name: "5. Elevaciones máquina disco laterales", target: "3 series x 10-12 rep.", defaultWeight: 5, defaultReps: "12" },
    { id: "d2_e6", name: "6. Gemelo de pie", target: "3 series x 10-12 rep.", defaultWeight: 40, defaultReps: "12" },
    { id: "d2_e7", name: "7. Curl inverso para antebrazo", target: "2 series x 10-12 rep.", defaultWeight: 15, defaultReps: "12" },
    { id: "d2_e8", name: "8. Hiperextensiones lumbares", target: "2 series x 10-12 rep.", defaultWeight: 0, defaultReps: "12" }
  ],
  "3": [
    { id: "d3_e1", name: "1. Hip Thrust - Glúteo", target: "3 series x 8-10 rep.", defaultWeight: 0, defaultReps: "10" },
    { id: "d3_e2", name: "2. Extensiones de cuádriceps", target: "2 series x 10-12 rep.", defaultWeight: 20, defaultReps: "12" },
    { id: "d3_e3", name: "3. Pullover en polea alta", target: "3 series x 10-12 rep.", defaultWeight: 25, defaultReps: "12" },
    { id: "d3_e4", name: "4. Press de hombro máquina palancas de discos sentado", target: "3 series x 8-10 rep.", defaultWeight: 15, defaultReps: "10" },
    { id: "d3_e5", name: "5. Extensión de tríceps agarre ancho", target: "2 series x 10-12 rep.", defaultWeight: 30, defaultReps: "12" },
    { id: "d3_e6", name: "6. Curl de bíceps en polea UVE", target: "2 series x 10-12 rep.", defaultWeight: 15, defaultReps: "12" },
    { id: "d3_e7", name: "7. Aductores cerrar en máquina", target: "2 series x 12-15 rep.", defaultWeight: 15, defaultReps: "15" },
    { id: "d3_e8", name: "8. Abdominal superior", target: "2 series x 15-20 rep.", defaultWeight: 0, defaultReps: "20" }
  ]
};

var appData = { videoUrls: {}, cloudMusicUrl: "", history: [] };
try {
  var saved = localStorage.getItem('gym_routine_pro_data');
  if (saved) appData = JSON.parse(saved);
  if (!appData.history) appData.history = [];
  if (!appData.videoUrls) appData.videoUrls = {};
  if (!appData.cloudMusicUrl) appData.cloudMusicUrl = "";
} catch(e){}

var audioPlayer = document.getElementById('audioPlayer');

if (appData.cloudMusicUrl) {
  audioPlayer.src = appData.cloudMusicUrl;
  document.getElementById('songTitle').textContent = "Pista Nube Configurada";
}

function setCloudMusicUrl() {
  var url = prompt("Introduce el enlace directo de descarga/reproducción de tu audio en Google Cloud / Drive:", appData.cloudMusicUrl);
  if (url !== null) {
    appData.cloudMusicUrl = url;
    audioPlayer.src = url;
    localStorage.setItem('gym_routine_pro_data', JSON.stringify(appData));
    document.getElementById('songTitle').textContent = "Pista Nube Configurada";
    alert("Enlace de música configurado correctamente.");
  }
}

document.getElementById('audioFileInput').addEventListener('change', function(e) {
  var file = e.target.files[0];
  if (file) {
    var fileURL = URL.createObjectURL(file);
    audioPlayer.src = fileURL;
    document.getElementById('songTitle').textContent = file.name;
    alert("Audio local cargado: " + file.name);
  }
});

var isPlaying = false;
function togglePlayMusic() {
  if (!audioPlayer.src) {
    alert("Por favor, configura primero un enlace de música en la nube con el botón 🔗 Enlace.");
    return;
  }
  if (!isPlaying) {
    audioPlayer.play().then(function() {
      isPlaying = true;
      document.getElementById('playPauseBtn').textContent = "⏸ Pause";
    }).catch(function(err) {
      alert("Error al reproducir audio: " + err.message);
    });
  } else {
    audioPlayer.pause();
    isPlaying = false;
    document.getElementById('playPauseBtn').textContent = "▶ Play";
  }
}

document.getElementById('volumeSlider').addEventListener('input', function(e) {
  audioPlayer.volume = e.target.value;
});

var exChartInstance = null;
var globalChartInstance = null;

function renderExercises() {
  var daySelect = document.getElementById('daySelect');
  if (!daySelect) return;
  var currentDay = daySelect.value;
  var container = document.getElementById('exercisesContainer');
  container.innerHTML = '';
  
  if (!currentDay || !baseRoutines[currentDay]) {
    container.innerHTML = '<p style="text-align:center; color:#a1a1aa; padding: 24px;">👆 Selecciona un bloque en <strong>Bloque de Entreno</strong> para cargar los ejercicios.</p>';
    return;
  }
  
  var exercises = baseRoutines[currentDay];
  var lastSession = { data: {} };
  for (var i = appData.history.length - 1; i >= 0; i--) {
    if (String(appData.history[i].day) === String(currentDay)) {
      lastSession = appData.history[i];
      break;
    }
  }

  for (var j = 0; j < exercises.length; j++) {
    var ex = exercises[j];
    var exData = (lastSession.data && lastSession.data[ex.id]) ? lastSession.data[ex.id] : { weight: ex.defaultWeight, reps: ex.defaultReps, notes: '' };
    var videoUrl = appData.videoUrls[ex.id] || "";

    var card = document.createElement('div');
    card.className = "card";
    
    var html = '<div style="display:flex; justify-content:space-between; align-items:flex-start; margin-bottom: 8px;">';
    html += '<div style="flex:1; min-width:0; padding-right:8px;"><strong style="font-size:16px; color:#fd5e09; display:block;">' + ex.name + '</strong>';
    html += '<div style="font-size:12px; color:#f59e0b; margin-top:2px;">' + ex.target + '</div></div>';
    
    if (videoUrl) {
      html += '<a href="' + videoUrl + '" target="_blank" class="btn-link">▶ Vídeo</a>';
    } else {
      html += '<button type="button" class="btn-link" onclick="promptVideoUrl(\'' + ex.id + '\')">+ Enlace</button>';
    }
    
    html += '</div>';
    
    html += '<div class="grid">';
    html += '<div><label>Peso (kg)</label><div class="counter">';
    html += '<button type="button" onclick="adjustVal(\'' + ex.id + '_weight\', -2.5)">-</button>';
    html += '<input type="number" step="0.5" id="' + ex.id + '_weight" value="' + (exData.weight !== undefined ? exData.weight : ex.defaultWeight) + '">';
    html += '<button type="button" onclick="adjustVal(\'' + ex.id + '_weight\', 2.5)">+</button>';
    html += '</div></div>';
    html += '<div><label>Reps / Series</label><input type="text" id="' + ex.id + '_reps" value="' + (exData.reps || ex.defaultReps) + '"></div>';
    html += '</div>';

    html += '<div style="margin-top: 10px;">';
    html += '<label>Notas / Sensaciones</label>';
    html += '<input type="text" id="' + ex.id + '_notes" value="' + (exData.notes || '') + '" placeholder="Escribe tus sensaciones, cargas o técnica...">';
    html += '</div>';

    card.innerHTML = html;
    container.appendChild(card);
  }
}

function promptVideoUrl(exId) {
  var url = prompt("Introduce la URL del vídeo para este ejercicio:");
  if (url) {
    appData.videoUrls[exId] = url;
    localStorage.setItem('gym_routine_pro_data', JSON.stringify(appData));
    renderExercises();
  }
}

function processPDF(event) {
  var file = event.target.files[0];
  if (!file) return;
  var reader = new FileReader();
  reader.onload = function() {
    var typedarray = new Uint8Array(this.result);
    pdfjsLib.getDocument(typedarray).promise.then(function(pdf) {
      var numPages = pdf.numPages;
      var textPromises = [];
      for (var i = 1; i <= numPages; i++) {
        textPromises.push(pdf.getPage(i).then(function(page) {
          return page.getTextContent().then(function(tc) {
            return tc.items.map(function(item){ return item.str; }).join(' ');
          });
        }));
      }
      Promise.all(textPromises).then(function(pagesText) {
        var fullText = pagesText.join(' ');
        var urlRegex = /(https?:\/\/[^\s]+)/g;
        var urls = fullText.match(urlRegex) || [];

        var linkPromises = [];
        for (var p = 1; p <= numPages; p++) {
          linkPromises.push(pdf.getPage(p).then(function(page) {
            return page.getAnnotations();
          }));
        }
        Promise.all(linkPromises).then(function(annotPages) {
          annotPages.forEach(function(annots) {
            annots.forEach(function(annot) {
              if (annot.url && urls.indexOf(annot.url) === -1) {
                urls.push(annot.url);
              }
            });
          });

          var allExIds = [];
          Object.keys(baseRoutines).forEach(function(day) {
            baseRoutines[day].forEach(function(ex) {
              allExIds.push(ex.id);
            });
          });

          var assignedCount = 0;
          urls.forEach(function(url, idx) {
            if (idx < allExIds.length) {
              appData.videoUrls[allExIds[idx]] = url;
              assignedCount++;
            }
          });

          localStorage.setItem('gym_routine_pro_data', JSON.stringify(appData));
          renderExercises();
          alert("¡PDF procesado! Se han cargado automáticamente " + assignedCount + " enlaces de vídeo.");
        });
      });
    }).catch(function(err) {
      alert("Error al leer el PDF: " + err.message);
    });
  };
  reader.readAsArrayBuffer(file);
}

function adjustVal(inputId, amount) {
  var el = document.getElementById(inputId);
  if (!el) return;
  var val = parseFloat(el.value) || 0;
  el.value = Math.max(0, val + amount);
}

function saveData(showAlert) {
  var currentDay = document.getElementById('daySelect').value;
  if (!currentDay) { 
    if(showAlert) alert("Por favor, selecciona primero un Bloque de Entreno."); 
    return false; 
  }

  var date = document.getElementById('sessionDate').value;
  var exercises = baseRoutines[currentDay] || [];
  var sessionData = {};

  for (var k = 0; k < exercises.length; k++) {
    var ex = exercises[k];
    var weightEl = document.getElementById(ex.id + '_weight');
    var repsEl = document.getElementById(ex.id + '_reps');
    var notesEl = document.getElementById(ex.id + '_notes');
    sessionData[ex.id] = {
      weight: weightEl ? weightEl.value : '',
      reps: repsEl ? repsEl.value : '',
      notes: notesEl ? notesEl.value : '',
      name: ex.name,
      exId: ex.id
    };
  }

  appData.history.push({ date: date, day: currentDay, data: sessionData });
  localStorage.setItem('gym_routine_pro_data', JSON.stringify(appData));
  if(showAlert) alert("¡Sesión guardada con éxito!");
  return true;
}

function exitAndSave() {
  saveData(false);
  try {
    window.close();
  } catch(e) {}
  window.location.href = "about:blank";
}

function toggleModal(show) {
  document.getElementById('historyModal').style.display = show ? 'flex' : 'none';
  if (show) {
    populateCompareDropdown();
    loadHistoryModal();
  }
}

function switchTab(tab) {
  document.getElementById('tabSessions').className = 'tab-btn' + (tab === 'sessions' ? ' active' : '');
  document.getElementById('tabExercise').className = 'tab-btn' + (tab === 'exercise' ? ' active' : '');
  document.getElementById('tabGlobal').className = 'tab-btn' + (tab === 'global' ? ' active' : '');
  
  document.getElementById('viewSessions').style.display = tab === 'sessions' ? 'block' : 'none';
  document.getElementById('viewExercise').style.display = tab === 'exercise' ? 'block' : 'none';
  document.getElementById('viewGlobal').style.display = tab === 'global' ? 'block' : 'none';
  
  if (tab === 'exercise') renderExerciseAnalysis();
  if (tab === 'global') renderGlobalAnalysis();
}

function populateCompareDropdown() {
  var select = document.getElementById('exerciseCompareSelect');
  select.innerHTML = '';
  var days = Object.keys(baseRoutines);
  for (var d = 0; d < days.length; d++) {
    var day = days[d];
    var exList = baseRoutines[day];
    for (var e = 0; e < exList.length; e++) {
      var ex = exList[e];
      var opt = document.createElement('option');
      opt.value = ex.id;
      opt.textContent = ex.name + ' (Bloque ' + day + ')';
      select.appendChild(opt);
    }
  }
}

function renderExerciseAnalysis() {
  var selectedExId = document.getElementById('exerciseCompareSelect').value;
  var container = document.getElementById('exerciseAnalysisContent');
  container.innerHTML = '';

  var records = [];
  for (var h = 0; h < appData.history.length; h++) {
    var s = appData.history[h];
    if (s.data && s.data[selectedExId] && s.data[selectedExId].weight !== '') {
      records.push({
        date: s.date,
        weight: parseFloat(s.data[selectedExId].weight) || 0
      });
    }
  }

  if (records.length === 0) {
    container.innerHTML = '<p style="font-size:14px; color:#a1a1aa; text-align:center; padding:16px;">No hay datos guardados para este ejercicio.</p>';
    if(exChartInstance) exChartInstance.destroy();
    return;
  }

  var labels = records.map(function(r){ return r.date; });
  var dataWeights = records.map(function(r){ return r.weight; });

  if (window.Chart) {
    if(exChartInstance) exChartInstance.destroy();
    var ctx = document.getElementById('exerciseChart').getContext('2d');
    exChartInstance = new Chart(ctx, {
      type: 'line',
      data: {
        labels: labels,
        datasets: [{
          label: 'Peso (kg)',
          data: dataWeights,
          borderColor: '#fd5e09',
          backgroundColor: 'rgba(253, 94, 9, 0.2)',
          fill: true,
          tension: 0.3,
          borderWidth: 3
        }]
      },
      options: {
        responsive: true,
        scales: {
          x: { ticks: { color: '#a1a1aa' } },
          y: { ticks: { color: '#a1a1aa' } }
        }
      }
    });
  }

  var maxW = Math.max.apply(null, dataWeights);
  var diff = dataWeights[dataWeights.length - 1] - dataWeights[0];

  var resHtml = '<div style="background:#050201; padding:12px; border-radius:10px; border:1px solid #7c2d12; display:flex; justify-content:space-around; text-align:center; margin-top:10px;">';
  resHtml += '<div><div style="font-size:11px; color:#a1a1aa;">PESO MÁXIMO</div><div style="font-size:18px; font-weight:bold; color:#fd5e09;">' + maxW + ' kg</div></div>';
  resHtml += '<div><div style="font-size:11px; color:#a1a1aa;">INCREMENTO TOTAL</div><div style="font-size:18px; font-weight:bold; color:' + (diff >= 0 ? '#22c55e' : '#f87171') + ';">' + (diff >= 0 ? '+' : '') + diff + ' kg</div></div>';
  resHtml += '</div>';

  container.innerHTML = resHtml;
}

function renderGlobalAnalysis() {
  if (appData.history.length === 0 || !window.Chart) return;

  var labels = appData.history.map(function(s){ return s.date + ' (Bloque ' + s.day + ')'; });
  var totalWeights = appData.history.map(function(s){
    var sum = 0;
    var keys = Object.keys(s.data);
    for(var k=0; k<keys.length; k++) {
      sum += (parseFloat(s.data[keys[k]].weight) || 0);
    }
    return sum;
  });

  if(globalChartInstance) globalChartInstance.destroy();
  var ctx = document.getElementById('globalChart').getContext('2d');
  globalChartInstance = new Chart(ctx, {
    type: 'bar',
    data: {
      labels: labels,
      datasets: [{
        label: 'Carga Total Movida por Sesión (kg)',
        data: totalWeights,
        backgroundColor: '#ea580c'
      }]
    },
    options: {
      responsive: true,
      scales: {
        x: { ticks: { color: '#a1a1aa' } },
        y: { ticks: { color: '#a1a1aa' } }
      }
    }
  });
}

function loadHistoryModal() {
  var container = document.getElementById('historyList');
  container.innerHTML = '';
  if(!appData.history || appData.history.length === 0) {
    container.innerHTML = '<p style="font-size:14px; color:#a1a1aa; text-align:center;">No hay sesiones guardadas aún.</p>';
    return;
  }

  var reversed = appData.history.slice().reverse();
  for (var r = 0; r < reversed.length; r++) {
    var s = reversed[r];
    var originalIndex = appData.history.length - 1 - r;
    var item = document.createElement('div');
    item.style.cssText = 'background:#050201; padding:14px; border-radius:12px; border:1.5px solid #7c2d12; margin-bottom:12px; font-size:13px; position:relative;';
    
    var exercisesHtml = '';
    var keys = Object.keys(s.data);
    for (var k = 0; k < keys.length; k++) {
      var d = s.data[keys[k]];
      if (d.weight) {
        exercisesHtml += '<div style="display:flex; justify-content:space-between; margin-bottom:6px; border-bottom:1px solid #1f0f04; padding-bottom:4px;">';
        exercisesHtml += '<span style="font-weight:600; color:#f8fafc;">' + d.name + '</span>';
        exercisesHtml += '<span style="color:#fd5e09; font-weight:bold;">' + d.weight + ' kg (' + (d.reps || 'reps N/A') + ')</span>';
        exercisesHtml += '</div>';
      }
    }

    var headerHtml = '<div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:10px;">';
    headerHtml += '<span style="font-weight:bold; color:#f59e0b; font-size:14px;">📅 ' + s.date + ' - Bloque ' + s.day + '</span>';
    headerHtml += '<button type="button" class="btn-danger" onclick="deleteSession(' + originalIndex + ')">🗑️ Eliminar</button>';
    headerHtml += '</div>';

    item.innerHTML = headerHtml + '<div>' + exercisesHtml + '</div>';
    container.appendChild(item);
  }
}

function deleteSession(index) {
  if (confirm("¿Estás seguro de que deseas eliminar esta sesión del historial?")) {
    appData.history.splice(index, 1);
    localStorage.setItem('gym_routine_pro_data', JSON.stringify(appData));
    loadHistoryModal();
    renderGlobalAnalysis();
  }
}

function downloadCSV() {
  if(!appData.history || appData.history.length === 0) { alert("No hay datos."); return; }
  var csv = "Fecha,Bloque,Ejercicio,Peso_kg,Reps,Notas\n";
  for (var i = 0; i < appData.history.length; i++) {
    var s = appData.history[i];
    var keys = Object.keys(s.data);
    for (var k = 0; k < keys.length; k++) {
      var d = s.data[keys[k]];
      if(d.weight) {
        csv += '"' + s.date + '","Bloque ' + s.day + '","' + d.name + '","' + d.weight + '","' + d.reps + '","' + d.notes + '"\n';
      }
    }
  }

  var blob = new Blob([csv], { type: 'text/csv' });
  var url = window.URL.createObjectURL(blob);
  var a = document.createElement('a');
  a.href = url;
  a.download = 'Historial_Gimnasio.csv';
  a.click();
}

window.addEventListener('DOMContentLoaded', function() {
  var dateInput = document.getElementById('sessionDate');
  if (dateInput) {
    dateInput.value = '2026-10-24';
  }
  
  var daySelect = document.getElementById('daySelect');
  if (daySelect) daySelect.addEventListener('change', renderExercises);
  
  var pdfInput = document.getElementById('pdfInput');
  if (pdfInput) pdfInput.addEventListener('change', processPDF);
  
  var btnSaveBtn = document.getElementById('btnSaveBtn');
  if (btnSaveBtn) btnSaveBtn.addEventListener('click', function(){ saveData(true); });
  
  var btnHistoryBtn = document.getElementById('btnHistoryBtn');
  if (btnHistoryBtn) btnHistoryBtn.addEventListener('click', function(){ toggleModal(true); });
  
  var btnExitBtn = document.getElementById('btnExitBtn');
  if (btnExitBtn) btnExitBtn.addEventListener('click', exitAndSave);
  
  var btnFullscreenBtn = document.getElementById('btnFullscreenBtn');
  if (btnFullscreenBtn) btnFullscreenBtn.addEventListener('click', function() {
    try {
      if (!document.fullscreenElement) document.documentElement.requestFullscreen();
      else if (document.exitFullscreen) document.exitFullscreen();
    } catch(e){}
  });
  
  var btnCloseModal = document.getElementById('btnCloseModal');
  if (btnCloseModal) btnCloseModal.addEventListener('click', function(){ toggleModal(false); });
  
  var tabSessions = document.getElementById('tabSessions');
  if (tabSessions) tabSessions.addEventListener('click', function(){ switchTab('sessions'); });
  
  var tabExercise = document.getElementById('tabExercise');
  if (tabExercise) tabExercise.addEventListener('click', function(){ switchTab('exercise'); });
  
  var tabGlobal = document.getElementById('tabGlobal');
  if (tabGlobal) tabGlobal.addEventListener('click', function(){ switchTab('global'); });
  
  var exerciseCompareSelect = document.getElementById('exerciseCompareSelect');
  if (exerciseCompareSelect) exerciseCompareSelect.addEventListener('change', renderExerciseAnalysis);
  
  var btnExportCSV = document.getElementById('btnExportCSV');
  if (btnExportCSV) btnExportCSV.addEventListener('click', downloadCSV);
});
</script>
</body>
</html>
